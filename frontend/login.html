<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | RestPro</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="login">
  <header id="navbar"></header>
  <main class="section narrow">
    <h1>Customer Login</h1>
    <p>Log in with your email to proceed with table reservations.</p>
    <form id="loginForm" class="form-card">
      <label>Email Address
        <input id="loginEmail" type="email" placeholder="your.email@example.com" required>
      </label>
      <label>Password
        <input id="loginPassword" type="password" required>
      </label>
      <button class="btn" type="submit" style="width:100%; margin-top:0.5rem;">Login</button>
      <p id="loginMessage" role="status" style="margin-top:1rem; text-align:center;"></p>
      <p style="margin-top:1.25rem; text-align:center; font-size:0.9rem;">New customer? <a href="register.html" style="color:var(--primary-color); font-weight:600;">Create an account</a></p>
    </form>
  </main>
  <footer class="site-footer">© 2026 RestPro Reservation System
  <a class="admin-settings-link" href="admin-login.html" aria-label="Administrator login" title="Administrator login">

</body>
</html>
